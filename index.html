<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engine</title>
<meta name="description" content="Strength, cardio and body tracking with coaching from Claude.">
<meta name="theme-color" content="#0B1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Engine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling content, fixed bottom tab bar.
   Cards only mark things you act on (sessions, forms); everything else sits on the page. */
:root{
  --bg:#111315; --surface:#1A1D20; --surface-2:#23272B; --line:#30353B;
  --fg:#ECEEF0; --muted:#A3A9B0; --faint:#717880;
  --accent:#5B8CFF; --accent-ink:#0A0F1C;
  --accent-soft:color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 50%, transparent);
  --good:#4CC98E; --warn:#E5B54A; --bad:#EF6A66;
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-sm:10px; --nav-h:62px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sheet-t:focus{outline:none}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:58px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr h1{flex:1;min-width:0;font-size:24px;font-weight:760;font-stretch:82%;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .icon{margin-left:-8px}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
body.logging main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:var(--muted)}
.icon:active{background:var(--surface-2)}

/* type */
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);font-size:13.5px}
.faint{color:var(--faint)}
.big{font-size:30px;font-weight:760;font-stretch:85%;line-height:1.05}
.h2{font-size:22px;font-weight:740;font-stretch:85%}
.h3{font-size:17px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.acc{color:var(--accent)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h .link{font-size:13.5px;color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;text-align:left;width:100%}
.rowi:last-child{border-bottom:0}
.rowi .grow{flex:1;min-width:0}
.rowi .t{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .chev{color:var(--faint)}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .rowi{padding:10px 0}
.mi{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.mi svg.ic{width:20px;height:20px}
.slist{padding-block:2px;gap:0}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.srow .t{font-weight:620}
.srow .sub{font-size:12.5px}
.srow .chev{color:var(--faint)}
.mini-seg{grid-auto-columns:64px}
.ctl2{display:flex;gap:6px;flex:none}
.mini.day{width:84px;text-align:left;padding-left:10px}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.mini-seg button{min-height:32px;font-size:13px}
.sw2{position:relative;width:48px;height:28px;flex:none}
.sw2 input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw2 i{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .2s,border-color .2s}
.sw2 i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .22s cubic-bezier(.3,1.4,.5,1),background .2s}
.sw2 input:checked+i{background:var(--accent);border-color:var(--accent)}
.sw2 input:checked+i::after{transform:translateX(20px);background:var(--accent-ink)}
.sw2 input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:22px;font-weight:740;font-stretch:88%;line-height:1.1;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.sk{display:flex;flex-direction:column;gap:22px}
.sk-col{display:flex;flex-direction:column;gap:10px}
.skel{display:block;border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:300% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;white-space:nowrap}
.btn:active{filter:brightness(1.15)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:9px;font-weight:650;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.in{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
textarea.in{padding:10px 12px;min-height:72px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.in:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile-b{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;flex:1;min-width:0;width:100%}
.tile-b .eyebrow{font-size:11px}
.tile-b .tn{font-weight:700;font-size:15.5px;line-height:1.25}
.tile-b .sub{font-size:12.5px}
.tile .btn{width:100%}
.rtile{gap:4px;text-align:left;align-items:flex-start}
.rtile .t{font-weight:680;line-height:1.25;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai p{margin:0 0 6px}.msg.ai p:last-child{margin:0}.msg.ai ul{margin:4px 0 6px;padding-left:18px}.msg.ai h4{margin:6px 0 2px;font-size:14.5px}
.prop{border-color:var(--accent-line)}
.chatbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:6px 0}
.chatbar textarea{flex:1;min-height:44px;max-height:140px;resize:none}
.chatbar .send{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:44px;height:44px}
.chatbar .send:disabled{opacity:.4}
.coachbtn{display:flex;flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%}
.coachbtn .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.follow{align-items:center;text-align:center;gap:8px}
.follow .ring{position:relative;width:170px;height:170px;margin:4px auto}
.follow .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.follow .ring circle{fill:none;stroke-width:9}
.follow .ring .bg{stroke:var(--surface-2)}
.follow .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.follow .ring.prep .fg{stroke:var(--muted)}
.follow .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:760;font-stretch:85%}
.follow .cue{font-size:14.5px;color:var(--muted);max-width:34ch}
.follow .btnrow{justify-content:center;width:100%}
.follow .btnrow .btn{flex:1}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fold{display:flex;flex-direction:column;gap:10px}
.fold-h{display:flex;align-items:center;gap:4px}
.fold-t{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:44px;text-align:left}
.fold-t .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fold-t .chev{color:var(--faint);margin-left:auto;transition:transform .15s}
.fold-t[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pm{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.pm button{width:38px;height:40px;font-size:18px;color:var(--muted)}
.pm button:active{background:var(--surface-2)}
.pm b{min-width:52px;text-align:center;font-weight:650}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.confirm{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}

/* today */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border-radius:12px;min-width:0}
.wd .d{font-size:11.5px;color:var(--faint);font-weight:650;letter-spacing:.04em}
.wd .n{font-size:17px;font-weight:700}
.wd.sel{background:var(--surface);outline:1px solid var(--line)}
.wd.today .n{color:var(--accent)}
.donepill.miss{color:var(--muted);background:var(--surface-2)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:-4px -8px 0}
.mcal{display:flex;flex-direction:column;gap:6px}
.mh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--faint);font-weight:650;letter-spacing:.04em}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 8px;border-radius:10px;min-width:0}
.cd .n{font-size:15px;font-weight:650}
.cd.out{opacity:.38}
.cd.today .n{color:var(--accent)}
.cd.sel{background:var(--surface);outline:1px solid var(--line)}
.cd .marks{display:flex;gap:3px;min-height:7px;flex-wrap:wrap;justify-content:center;max-width:100%}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--faint);font-weight:700;font-size:14px;letter-spacing:.02em;padding:8px 0}
.brand svg{color:var(--accent)}
.calkey{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:4px}
.calkey span{display:inline-flex;align-items:center;gap:6px}
.wd .marks{display:flex;gap:3px;min-height:8px}
.mk{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.mk.done{background:var(--accent);border-color:var(--accent)}
.mk.miss{border-color:var(--line)}
.sess .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sess h2{font-size:26px;font-weight:760;font-stretch:84%;line-height:1.05;margin-top:2px}
.sess ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.sess li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.sess li span:last-child{color:var(--muted);white-space:nowrap}
.sess li .gtag,.card.flat .gtag{min-width:24px;height:19px;font-size:11.5px;margin-right:6px;vertical-align:1px}
.donepill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.coach{border-left:0;background:var(--surface)}
.md{display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.5}
.md h4{font-size:14px;font-weight:700;margin-top:6px}
.md ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}

/* logger */
.logmeta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.logmeta b{color:var(--fg);font-size:16px}
.undob{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.undob .ic{width:16px;height:16px}
.fb{gap:0;padding-block:6px}
.fbr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fbr:last-child{border-bottom:0}
.fbr{width:100%;text-align:left}
/* social */
.navi{position:relative;display:inline-flex}.ndot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.bellb{position:relative}.bcount{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:750;font-style:normal;display:grid;place-items:center}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:720;font-size:15px;color:#0B0D10;letter-spacing:.02em}
.av.sm{width:30px;height:30px;font-size:12px}.av.lg{width:64px;height:64px;font-size:24px}
.post{gap:12px}.post-h{display:flex;align-items:center;gap:8px;min-width:0}
.post-a,.srow .post-a{display:flex;flex-direction:row;align-items:center;gap:12px;text-align:left;min-width:0;flex:1}.post-a .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.post-t{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;margin:0}.clamp6{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pgrid{display:grid;gap:4px;border-radius:12px;overflow:hidden;margin-inline:-2px}.pgrid.n1{grid-template-columns:1fr}.pgrid.n2,.pgrid.n4{grid-template-columns:1fr 1fr}.pgrid.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.pgrid.n3 .pph:first-child{grid-row:span 2}
.pph{position:relative;aspect-ratio:1;background:var(--surface-2);overflow:hidden;padding:0}.pgrid.n1 .pph{aspect-ratio:4/3}.pgrid.n3 .pph:first-child{aspect-ratio:auto}.pph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}.att .stat b{font-size:19px}.att .btn.sm{align-self:flex-start}.att .link{align-self:flex-start;color:var(--accent);font-size:13.5px;font-weight:600}
.exl{display:flex;flex-direction:column}.exl .cmp{padding:6px 0;font-size:14px}
.post-f{display:flex;align-items:center;gap:6px;margin:0 -6px -4px;min-width:0}
.pbtn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 10px;border-radius:999px;color:var(--muted);font-weight:650;font-size:14px}.pbtn:active{background:var(--surface-2)}.pbtn.on{color:var(--accent)}.pbtn svg.ic{width:20px;height:20px}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:650}.badge svg.ic{width:15px;height:15px;color:var(--accent)}

.ph img{width:100%;height:100%;object-fit:cover}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}

.wipe{position:relative;border-radius:12px;overflow:hidden;touch-action:pan-y}

.wipe .ph.top{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}

.wipe .lab{position:absolute;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none}

.daycard{display:flex;flex-direction:column;gap:10px}
.item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}

.item.grp{border-left:3px solid var(--accent);padding-left:10px}

.lnk{display:flex;justify-content:center;margin:-2px 0}
.lnk.on{justify-content:flex-start;border-left:3px solid var(--accent);padding-left:10px}

/* motion */
@keyframes vpush{from{opacity:0;transform:translateX(32px)}}

<body>
<div id="app">
  <header id="hdr" class="hdr"></header>
  <main id="main"></main>
  <nav id="nav" class="nav" aria-label="Sections"></nav>

</div>

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dix = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const ixd = i => { const d = new Date(i * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => ixd(dix(s) + n);
const diffDays = (a, b) => dix(a) - dix(b);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtD = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtShort = s => { const d = pd(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const mondayOf = s => addDays(s, -((pd(s).getDay() + 6) % 7));
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

function stackChart(o) {

  let s = `<svg class="chart tap" data-chart="${cid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Stacked bar chart')}">`;

}

/* ================= markdown-lite ================= */
function md(t) {
  const lines = esc(t || '').split('\n'); let h = '', inUl = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (let ln of lines) {
    ln = ln.trim();
    const li = ln.match(/^[-•*]\s+(.*)/);
    if (li) { if (!inUl) { h += '<ul>'; inUl = true; } h += `<li>${inline(li[1])}</li>`; continue; }
    if (inUl) { h += '</ul>'; inUl = false; }
    if (!ln) continue;
    const hd = ln.match(/^(?:#{1,4}\s*)?\*\*(.+?)\*\*:?$/) || ln.match(/^#{1,4}\s+(.*)$/);
    if (hd) h += `<h4>${hd[1]}</h4>`; else h += `<p>${inline(ln)}</p>`;
  }
  if (inUl) h += '</ul>';
  return `<div class="md">${h}</div>`;
}

// o.level: muscle -> 0..1 shade; o.sel: muscle drawn in full accent; o.act: tapping a muscle sends that action with data-m.
function bodyMap(o = {}) {
  const fig = side => {
    const byM = new Map(), neutral = [], sil = [];
    for (const [m, sh, mir] of BODY_SHAPES[side]) { const g = sh + (mir ? `<g transform="matrix(-1 0 0 1 100 0)">${sh}</g>` : ''); if (m) byM.set(m, (byM.get(m) || '') + g); else (m === '' ? sil : neutral).push(g); }
    let h = `<g class="sil">${sil.join('')}</g><g class="nt">${neutral.join('')}</g>`;
    for (const [m, g] of byM) {
      const lv = o.level ? o.level[m] || 0 : 0, on = o.sel === m;
      h += `<g class="mu ${on ? 'on' : ''}" ${lv ? `style="--lv:${lv.toFixed(2)}"` : ''} ${o.act ? `data-act="${o.act}" data-m="${m}" role="button" tabindex="0" aria-pressed="${on}"` : ''} aria-label="${m}${o.label ? ': ' + esc(o.label(m)) : ''}">${g}</g>`;
    }
    return h;
  };
  return `<svg class="bm ${o.level ? 'heat' : ''}" viewBox="0 0 214 214" role="${o.act ? 'group' : 'img'}" aria-label="${esc(o.aria || 'Muscle map')}"><g transform="translate(2 2)">${fig('front')}</g><g transform="translate(112 2)">${fig('back')}</g><text x="52" y="212" text-anchor="middle">Front</text><text x="162" y="212" text-anchor="middle">Back</text></svg>`;
}

  else if (rel === 'incoming') h += `<div class="btnrow"><button class="btn primary" data-act="soaccept" data-id="${id}">Accept request</button><button class="btn ghost" data-act="sodecline" data-id="${id}">Decline</button></div>`;

// You and a friend side by side: this week, streaks and the lifts you both do.

  const bar = (label, a, b, fmt, sub) => { const mx = Math.max(a || 0, b || 0, 1); return `<div class="h2h"><div class="h2h-l"><span class="t">${label}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div><div class="h2h-r"><span class="h2h-b me"><i style="width:${Math.round(100 * (a || 0) / mx)}%"></i><b>${a == null ? '–' : fmt(a)}</b></span><span class="h2h-b"><i style="width:${Math.round(100 * (b || 0) / mx)}%"></i><b>${b == null ? '–' : fmt(b)}</b></span></div></div>`; };

  const la = mine.level && mine.level.data, lb2 = st.level && st.level.data;
  if (la && lb2) h += `<div class="sec"><span class="label">Gym bro level</span><div class="card">${bar('Level', la.score + 1, lb2.score + 1, v => GB_LEVELS[Math.min(6, Math.floor(v - 1))])}</div></div>`;
  const sa = streakInfo(), sb = st.streak && st.streak.data;

  h += `<div class="legend"><span><i></i>You</span><span><i class="mute"></i>${esc(them.name)}</span></div>`;

  if (a.mode === 'up' && pw.length < 8) { a.err = 'Use at least 8 characters for the password.'; render(); return; }
  a.busy = true; render();
  try {
    if (a.mode === 'up') {
      const r = await engine.signUp(email, pw);
      // Engine's database confirms its one account on creation, so signing in straight away normally works.
      if (r.needsConfirm) { try { await engine.signIn(email, pw); } catch (e) { a.busy = false; a.sent = true; render(); return; } }
    }
    else await engine.signIn(email, pw);
    startApp();
  } catch (e) { a.busy = false; a.err = authMsg(e); render(); }
}
document.addEventListener('submit', e => { if (e.target.id === 'auth-form') { e.preventDefault(); submitAuth(); } });
window.addEventListener('engine:auth', e => {
  if (e.detail === 'SIGNED_IN' && S.ui.auth && !S.ui.auth.busy) startApp();
  if (e.detail === 'SIGNED_OUT' && !S.ui.auth) { S.ui.auth = { mode: 'in', err: 'You were signed out. Sign in again to keep syncing. Nothing on this phone was lost.' }; render(); }
});
// Install prompt (Chrome on Android). The browser menu's "Install app" works too.
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; schedule(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Engine is installed. Open it from your home screen.'); schedule(); });
const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };
function installCard(always) {
  if (!installEvt || standalone() || (!always && LS.get('ft.noInstall', false))) return '';
  return `<div class="card"><span class="h3">Install Engine</span><span class="sub">Add Engine to your home screen so it opens like an app and works offline.</span><div class="btnrow"><button class="btn primary" data-act="install">Install</button>${always ? '' : '<button class="btn ghost" data-act="installlater">Not now</button>'}</div></div>`;
}

/* ================= boot ================= */
applyAccent(LS.get('ft.accent', DEF_SETTINGS.accent));
applyTheme(LS.get('ft.theme', DEF_SETTINGS));
const hash = (location.hash || '').slice(1);
if (['today', 'train', 'social', 'profile'].includes(hash)) S.ui.tab = hash; else if (hash === 'progress') S.ui.tab = 'prog'; else S.ui.tab = startTab();
applyLayout(settings());
const tabPicked = S.ui.tab !== 'today' || !!hash;
if (S.ui.inLog) wake();
let started = false;
function startApp() {
  S.ui.auth = null;
  // Another account's cached data never carries over.
  const id = window.engine && engine.uid && engine.uid();
  if (id && LS.get('ft.uid', id) !== id) { for (const col of COLS) S[col].clear(); outbox = []; S.active = null; for (const k of ['ft.cache', 'ft.outbox', 'ft.active', 'ft.push', 'ft.remindKey', ...SO_LS]) LS.del(k); memo.clear(); SC.clear(); postq = []; }
  if (id) LS.set('ft.uid', id);
  render();
  if (started) { flush(); return; }
  started = true;
  connect().then(() => { const st = settings(); if (st.accent) applyAccent(st.accent); applyTheme(st); applyLayout(st);
    // First launch on a new phone has no cached settings yet; open the chosen start screen once they arrive.
    if (!tabPicked && !S.ui.stack.length && S.ui.tab === 'today' && startTab() !== 'today') S.ui.tab = startTab();
    render(); saveTzPhone(); pushRefresh(); syncReminders(); });
}
if (window.engine && !engine.signedIn()) { S.ui.auth = { mode: 'in' }; render(); } else startApp();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // A new version activates in the background; reload right away at launch, otherwise the next time Engine comes back to the screen.
  const hadSW = !!navigator.serviceWorker.controller;
  let reloading = false, updateReady = false;
  const reload = () => { if (reloading) return; reloading = true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadSW) return; if (!S.active && performance.now() < 15000) reload(); else updateReady = true; });
  document.addEventListener('visibilitychange', () => { if (updateReady && document.visibilityState === 'visible' && !S.active) reload(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
let lastAccent = null, lastTheme = null;
let lastLayout = null;
setInterval(() => { const st = settings(), a = st.accent, k = [st.theme, st.customBg, st.customCard].join('|'), l = [st.fontScale, st.density, st.iconTheme, st.theme].join('|'); if (a !== lastAccent) { lastAccent = a; applyAccent(a); } if (k !== lastTheme) { lastTheme = k; applyTheme(st); } if (l !== lastLayout) { lastLayout = l; applyLayout(st); } }, 2000);
})();
</script>
